<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ProductMapper</title>
  <desc id="description">Conecta catálogos de proveedores con tus productos locales.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f55"/>
      <stop offset="1" stop-color="#0071ce"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1050" cy="70" r="280" fill="#38bdf8" opacity=".12"/>
  <circle cx="80" cy="600" r="250" fill="#ffc220" opacity=".10"/>
  <rect x="72" y="72" width="1056" height="486" rx="36" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".2"/>

  <g transform="translate(132 166)">
    <rect width="94" height="94" rx="24" fill="#ffffff"/>
    <g transform="translate(15 17) scale(1)">
      <path d="M8 24v22l24 12V36L8 24z" fill="#d97706" stroke="#451a03" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="m32 58 24-12V24L32 36v22z" fill="#f59e0b" stroke="#451a03" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="m8 24 24 12 24-12-24-12L8 24z" fill="#334155" stroke="#451a03" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="m8 24 10-14 18 8-4 6-24 0z" fill="#b45309" stroke="#451a03" stroke-width="2" stroke-linejoin="round"/>
      <path d="m56 24-10-14-18 8 4 6 24 0z" fill="#d97706" stroke="#451a03" stroke-width="2" stroke-linejoin="round"/>
      <path d="M32 10v16m-7-6 7 7 7-7" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="132" y="340" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">ProductMapper</text>
  <text x="136" y="398" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="500">Equivalencias de productos, en un solo lugar</text>

  <g transform="translate(136 460)" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">
